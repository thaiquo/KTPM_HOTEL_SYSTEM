spring.application.name=ai-service

server.port=8087

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
openrouter.temperature=${OPENROUTER_TEMPERATURE:0.3}
openrouter.max-output-tokens=${OPENROUTER_MAX_TOKENS:150}
openrouter.http-referer=${OPENROUTER_HTTP_REFERER:}
openrouter.app-name=${OPENROUTER_APP_NAME:HotelSystem}

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
