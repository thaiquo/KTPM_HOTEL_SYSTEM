server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      filter:
        request-rate-limiter:
          # Tránh 403 khi KeyResolver không lấy được key (môi trường proxy / IPv6).
          deny-empty-key: false
      # ── Global CORS (WebFlux Standard) ───────────────────────────────────────
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
              - "http://frontend:3000"
              - "http://192.168.1.8:3000"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
            allowedHeaders: ["*"]
            allowCredentials: true

      # ── Routes ───────────────────────────────────────────────────────────────
      routes:
        # AUTH – public endpoints không cần JWT, không rate-limit ketat
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth-api/**
          filters:
            - RewritePath=/auth-api(?<segment>/?.*), ${segment}
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 20
            #     redis-rate-limiter.burstCapacity: 40
            #     redis-rate-limiter.requestedTokens: 1
            #     key-resolver: "#{@ipKeyResolver}"

        # USER
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user-api/**
          filters:
            - RewritePath=/user-api(?<segment>/?.*), ${segment}
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 30
            #     redis-rate-limiter.burstCapacity: 60
            #     redis-rate-limiter.requestedTokens: 1
            #     key-resolver: "#{@ipKeyResolver}"

        # ROOM – đọc nhiều, cache Redis ở service
        - id: room-service
          uri: lb://room-service
          predicates:
            - Path=/room-api/**
          filters:
            - RewritePath=/room-api(?<segment>/?.*), ${segment}
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 50
            #     redis-rate-limiter.burstCapacity: 100
            #     redis-rate-limiter.requestedTokens: 1
            #     key-resolver: "#{@ipKeyResolver}"

        # BOOKING
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/booking-api/**
          filters:
            - RewritePath=/booking-api(?<segment>/?.*), ${segment}
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 20
            #     redis-rate-limiter.burstCapacity: 40
            #     redis-rate-limiter.requestedTokens: 1
            #     key-resolver: "#{@ipKeyResolver}"

        # PAYMENT – rate limit chặt nhất (tài chính)
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment-api/**
          filters:
            - RewritePath=/payment-api(?<segment>/?.*), ${segment}
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 10
            #     redis-rate-limiter.burstCapacity: 20
            #     redis-rate-limiter.requestedTokens: 1
            #     key-resolver: "#{@ipKeyResolver}"

        # NOTIFICATION
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification-api/**
          filters:
            - RewritePath=/notification-api(?<segment>/?.*), ${segment}
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 15
            #     redis-rate-limiter.burstCapacity: 30
            #     redis-rate-limiter.requestedTokens: 1
            #     key-resolver: "#{@ipKeyResolver}"

        # AI CHATBOT
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai-api/**
          filters:
            - RewritePath=/ai-api(?<segment>/?.*), ${segment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

