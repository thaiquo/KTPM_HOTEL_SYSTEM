server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          filter:
            request-rate-limiter:
              # Avoid 403 when a key cannot be resolved behind proxy/IPv6 setups.
              deny-empty-key: false
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                  - "http://frontend:3000"
                  - "http://192.168.1.8:3000"
                allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
                allowedHeaders: ["*"]
                allowCredentials: true

          routes:
            - id: auth-login-service
              uri: lb://auth-service
              order: -20
              predicates:
                - Path=/auth-api/auth/login
              filters:
                - RewritePath=/auth-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 6
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@authIdentityKeyResolver}"

            - id: auth-register-service
              uri: lb://auth-service
              order: -20
              predicates:
                - Path=/auth-api/auth/register
              filters:
                - RewritePath=/auth-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 4
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@authIdentityKeyResolver}"

            - id: auth-otp-service
              uri: lb://auth-service
              order: -20
              predicates:
                - Path=/auth-api/auth/send-otp,/auth-api/auth/verify-otp
              filters:
                - RewritePath=/auth-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@otpIdentityKeyResolver}"

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth-api/**
              filters:
                - RewritePath=/auth-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user-api/**
              filters:
                - RewritePath=/user-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userOrIpKeyResolver}"

            - id: room-service
              uri: lb://room-service
              predicates:
                - Path=/room-api/**
              filters:
                - RewritePath=/room-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/booking-api/**
              filters:
                - RewritePath=/booking-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userOrIpKeyResolver}"

            # Payment provider returns/IPNs are separate from user-facing payment
            # APIs so the user payment rate limit cannot drop provider callbacks.
            - id: payment-callback-service
              uri: lb://payment-service
              order: -10
              predicates:
                - Path=/payment-api/payments/vnpay-return,/payment-api/payments/vnpay-ipn,/payment-api/payments/momo-return,/payment-api/payments/momo-ipn
              filters:
                - RewritePath=/payment-api(?<segment>/?.*), ${segment}

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payment-api/**
              filters:
                - RewritePath=/payment-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userOrIpKeyResolver}"

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notification-api/**
              filters:
                - RewritePath=/notification-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userOrIpKeyResolver}"

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/ai-api/**
              filters:
                - RewritePath=/ai-api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 6
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userOrIpKeyResolver}"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

jwt:
  secret: iJXVUFK+5ccfmPvUHI8lY5CcSql77pZUS4gnf887kbM=

payment:
  callback:
    # Comma-separated exact IPs or CIDR ranges allowed to call provider IPN
    # endpoints. Empty means allow all for local/sandbox development; the
    # payment service still validates provider signatures/hashes.
    allowed-ips: ${PAYMENT_CALLBACK_ALLOWED_IPS:}
