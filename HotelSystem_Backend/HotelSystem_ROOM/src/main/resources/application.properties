spring.application.name=room-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_room}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:quocthai}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Only seed sample data when explicitly enabled (SEED_ENABLED=true)
app.seed.enabled=${SEED_ENABLED:false}

server.port=8083

jwt.secret=iJXVUFK+5ccfmPvUHI8lY5CcSql77pZUS4gnf887kbM=
jwt.expiration=90000

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME:thaiquoc}
spring.rabbitmq.password=${RABBIT_PASSWORD:123456}

# AWS S3 Configuration
aws.accessKeyId=${AWS_ACCESS_KEY_ID:local-access-key}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:local-secret-key}
aws.region=${AWS_REGION:ap-southeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:ktpmbtl-s3-bucket}

# Eureka
spring.application.name=room-service
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Redis Caching
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2000
spring.cache.type=redis
spring.cache.redis.enable-statistics=true
spring.cloud.compatibility-verifier.enabled=false