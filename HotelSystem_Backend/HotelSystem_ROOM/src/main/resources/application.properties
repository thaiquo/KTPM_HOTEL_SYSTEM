spring.application.name=HotelSystem_ROOM

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_room}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:quocthai}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8083

# Cache (Redis)
spring.cache.type=${CACHE_TYPE:redis}
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
cache.ttl-seconds=${CACHE_TTL_SECONDS:30}

# Rate limiting (server-side)
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
ratelimit.capacity=${RATE_LIMIT_CAPACITY:120}
ratelimit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:120}
ratelimit.refill-seconds=${RATE_LIMIT_REFILL_SECONDS:60}

# Room HOLD TTL (seconds) - default 6 minutes (within 5-7p)
room.hold.ttl-seconds=${ROOM_HOLD_TTL_SECONDS:360}
# Sweep interval for auto-release expired holds
room.hold.sweep-ms=${ROOM_HOLD_SWEEP_MS:30000}

