spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
booking.schema.auto-update-constraints=${BOOKING_SCHEMA_AUTO_UPDATE_CONSTRAINTS:true}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false
server.port=8084

jwt.secret=${JWT_SECRET}
jwt.expiration=90000

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2000
booking.lock.wait-ms=${BOOKING_LOCK_WAIT_MS:1500}
booking.lock.lease-ms=${BOOKING_LOCK_LEASE_MS:12000}
booking.idempotency.ttl-minutes=${BOOKING_IDEMPOTENCY_TTL_MINUTES:1440}

# Eureka
spring.application.name=booking-service
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Tracing
management.tracing.sampling.probability=0.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Resilience4j Config
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.roomServiceApi.max-attempts=3
resilience4j.retry.instances.roomServiceApi.wait-duration=3s
resilience4j.retry.instances.roomServiceApi.enable-exponential-backoff=true
resilience4j.retry.instances.roomServiceApi.exponential-backoff-multiplier=1.5
resilience4j.retry.instances.roomServiceApi.retry-exception-predicate=iuh.fit.hotelsystem_booking.config.TransientFeignRetryExceptionPredicate
resilience4j.retry.instances.userServiceApi.max-attempts=3
resilience4j.retry.instances.userServiceApi.wait-duration=3s
resilience4j.retry.instances.userServiceApi.enable-exponential-backoff=true
resilience4j.retry.instances.userServiceApi.exponential-backoff-multiplier=1.5
resilience4j.retry.instances.userServiceApi.retry-exception-predicate=iuh.fit.hotelsystem_booking.config.TransientFeignRetryExceptionPredicate
resilience4j.retry.instances.paymentStatusApi.max-attempts=3
resilience4j.retry.instances.paymentStatusApi.wait-duration=3s
resilience4j.retry.instances.paymentStatusApi.enable-exponential-backoff=true
resilience4j.retry.instances.paymentStatusApi.exponential-backoff-multiplier=1.5
resilience4j.retry.instances.paymentStatusApi.retry-exception-predicate=iuh.fit.hotelsystem_booking.config.TransientFeignRetryExceptionPredicate
resilience4j.retry.instances.paymentTransactionApi.max-attempts=3
resilience4j.retry.instances.paymentTransactionApi.wait-duration=3s
resilience4j.retry.instances.paymentTransactionApi.enable-exponential-backoff=true
resilience4j.retry.instances.paymentTransactionApi.exponential-backoff-multiplier=1.5
resilience4j.retry.instances.paymentTransactionApi.retry-exception-predicate=iuh.fit.hotelsystem_booking.config.TransientFeignRetryExceptionPredicate
spring.cloud.compatibility-verifier.enabled=false

# Feign client timeouts for external services
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.payment-service.connectTimeout=5000
feign.client.config.payment-service.readTimeout=5000
feign.client.config.room-service.connectTimeout=5000
feign.client.config.room-service.readTimeout=5000
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.payment-service.connectTimeout=5000
spring.cloud.openfeign.client.config.payment-service.readTimeout=5000
spring.cloud.openfeign.client.config.room-service.connectTimeout=5000
spring.cloud.openfeign.client.config.room-service.readTimeout=5000
