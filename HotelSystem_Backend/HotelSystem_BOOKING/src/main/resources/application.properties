spring.application.name=HotelSystem_BOOKING
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:quocthai}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8084

# Inter-service HTTP (ROOM validation)
room.service.base-url=${ROOM_SERVICE_URL:http://room-service:8083}
room.service.timeout-ms=${ROOM_SERVICE_TIMEOUT_MS:1500}

# Retry (ROOM call)
room.service.retry.max-attempts=${ROOM_SERVICE_RETRY_MAX_ATTEMPTS:3}
room.service.retry.backoff-ms=${ROOM_SERVICE_RETRY_BACKOFF_MS:1000}

# Booking HOLD TTL (seconds) - default 6 minutes (used to ignore late payment results)
booking.hold.ttl-seconds=${BOOKING_HOLD_TTL_SECONDS:360}

# Rate limiting (server-side)
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
ratelimit.capacity=${RATE_LIMIT_CAPACITY:60}
ratelimit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:60}
ratelimit.refill-seconds=${RATE_LIMIT_REFILL_SECONDS:60}

