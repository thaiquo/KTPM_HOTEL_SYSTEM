# Eureka
spring.application.name=booking-service
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Tracing
management.tracing.sampling.probability=0.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Resilience4j Config
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=3
spring.cloud.compatibility-verifier.enabled=false

# Feign client timeouts for external services
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.payment-service.connectTimeout=5000
feign.client.config.payment-service.readTimeout=5000
feign.client.config.room-service.connectTimeout=5000
feign.client.config.room-service.readTimeout=5000
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.payment-service.connectTimeout=5000
spring.cloud.openfeign.client.config.payment-service.readTimeout=5000
spring.cloud.openfeign.client.config.room-service.connectTimeout=5000
spring.cloud.openfeign.client.config.room-service.readTimeout=5000
