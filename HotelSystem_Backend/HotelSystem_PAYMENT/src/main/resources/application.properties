spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_payment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

server.port=8085
payment.schema.auto-update-constraints=${PAYMENT_SCHEMA_AUTO_UPDATE_CONSTRAINTS:true}
booking.service.url=${BOOKING_SERVICE_URL:http://booking-service:8084}
payment.checkin.confirm-url=${PAYMENT_CHECKIN_CONFIRM_URL:http://192.168.1.8:3000/payment/confirm}

jwt.secret=${JWT_SECRET}
jwt.expiration=90000

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}

# VNPAY Sandbox credentials (lay tu vnpay_nodejs/config/default.json)
vnpay.tmnCode=${VNP_TMN_CODE}
vnpay.hashSecret=${VNP_HASH_SECRET}
vnpay.payUrl=${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNP_RETURN_URL:http://127.0.0.1:8085/payments/vnpay-return}
vnpay.frontendReturnUrl=${VNP_FRONTEND_RETURN_URL:http://127.0.0.1:3000/payment-result}

# MoMo Sandbox credentials (lay tu momo_nodejs/MoMo.js)
momo.partnerCode=${MOMO_PARTNER_CODE:MOMO}
momo.accessKey=${MOMO_ACCESS_KEY:F8BBA842ECF85}
momo.secretKey=${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
momo.payUrl=${MOMO_PAY_URL:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirectUrl=${MOMO_REDIRECT_URL:http://127.0.0.1:8085/payments/momo-return}
momo.ipnUrl=${MOMO_IPN_URL:http://127.0.0.1:8085/payments/momo-ipn}
momo.partnerName=${MOMO_PARTNER_NAME:HotelSystem}
momo.storeId=${MOMO_STORE_ID:HotelSystemStore}
momo.frontendReturnUrl=${MOMO_FRONTEND_RETURN_URL:http://127.0.0.1:3000/payment-result}
momo.expireMinutes=${MOMO_EXPIRE_MINUTES:10}

# Eureka
spring.application.name=payment-service
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Tracing
management.tracing.sampling.probability=0.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
spring.cloud.compatibility-verifier.enabled=false

# Retry for safe payment -> booking-service lookup calls. Transaction confirmation is not retried here.
resilience4j.retry.instances.bookingServiceApi.max-attempts=3
resilience4j.retry.instances.bookingServiceApi.wait-duration=3s
resilience4j.retry.instances.bookingServiceApi.enable-exponential-backoff=true
resilience4j.retry.instances.bookingServiceApi.exponential-backoff-multiplier=1.5
resilience4j.retry.instances.bookingServiceApi.retry-exception-predicate=iuh.fit.hotelsystem_payment.config.TransientFeignRetryExceptionPredicate
resilience4j.retry.instances.bookingTransactionApi.max-attempts=3
resilience4j.retry.instances.bookingTransactionApi.wait-duration=3s
resilience4j.retry.instances.bookingTransactionApi.enable-exponential-backoff=true
resilience4j.retry.instances.bookingTransactionApi.exponential-backoff-multiplier=1.5
resilience4j.retry.instances.bookingTransactionApi.retry-exception-predicate=iuh.fit.hotelsystem_payment.config.TransientFeignRetryExceptionPredicate

# Feign timeout settings for booking-service synchronization
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.booking-service.connectTimeout=5000
feign.client.config.booking-service.readTimeout=5000
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.booking-service.connectTimeout=5000
spring.cloud.openfeign.client.config.booking-service.readTimeout=5000
