services:
  # ========================
  # EUREKA SERVER (Service Discovery)
  # ========================
  eureka-server:
    build: ./HotelSystem_Backend/HotelSystem_EUREKA
    ports:
      - "8761:8761"
    environment:
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========================
  # REDIS (Caching & Rate Limiting)
  # ========================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ========================
  # ZIPKIN (Distributed Tracing)
  # ========================
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"



  # ========================
  # RABBITMQ
  # ========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: thaiquoc
      RABBITMQ_DEFAULT_PASS: 123456

  # ========================
  # PGADMIN (UI quan ly DB)
  # ========================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    depends_on:
      - postgres-auth
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ========================
  # AUTH DB + SERVICE
  # ========================
  postgres-auth:
    image: postgres:15
    ports:
      - "56421:5432"
    environment:
      POSTGRES_DB: hotel_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - auth_data:/var/lib/postgresql/data

  auth-service:
    build: ./HotelSystem_Backend/HotelSystem_AUTH
    ports:
      - "8081:8081"
    depends_on:
      - postgres-auth
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/hotel_auth
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      VNP_TMN_CODE: ${VNP_TMN_CODE:-E6BOARWZ}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-O6OOMFFZPBLYQM9EGHLRTZEJUMPGCQZJ}
      VNP_PAY_URL: ${VNP_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-http://localhost:8085/payments/vnpay-return}
      VNP_FRONTEND_RETURN_URL: ${VNP_FRONTEND_RETURN_URL:-http://localhost:3000/payment-result}
      EUREKA_URL: http://eureka-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh


  postgres-user:
    image: postgres:15
    ports:
      - "56422:5432"
    environment:
      POSTGRES_DB: hotel_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - user_data:/var/lib/postgresql/data

  user-service:
    build: ./HotelSystem_Backend/HotelSystem_USER
    ports:
      - "8082:8082"
    depends_on:
      - postgres-user
    environment:
      DB_URL: jdbc:postgresql://postgres-user:5432/hotel_user
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      EUREKA_URL: http://eureka-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh




  # ========================
  # ROOM DB + SERVICE
  # ========================
  postgres-room:
    image: postgres:15
    ports:
      - "56423:5432"
    environment:
      POSTGRES_DB: hotel_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./HotelSystem_Backend/HotelSystem_ROOM/pg_hba.conf.dev:/var/lib/postgresql/data/pg_hba.conf
      - room_data:/var/lib/postgresql/data

  room-service:
    build: ./HotelSystem_Backend/HotelSystem_ROOM
    ports:
      - "8083:8083"
    depends_on:
      - postgres-room
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-room:5432/hotel_room
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-secret-key}
      AWS_REGION: ap-southeast-2

      AWS_S3_BUCKET: ktpmbtl-s3-bucket
      EUREKA_URL: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Ho_Chi_Minh


  # ========================
  # BOOKING DB + SERVICE
  # ========================
  postgres-booking:
    image: postgres:15
    ports:
      - "56424:5432"
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - booking_data:/var/lib/postgresql/data

  booking-service:
    build: ./HotelSystem_Backend/HotelSystem_BOOKING
    ports:
      - "8084:8084"
    depends_on:
      - postgres-booking
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-booking:5432/hotel_booking
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      EUREKA_URL: http://eureka-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh


  # ========================
  # PAYMENT DB + SERVICE
  # ========================
  postgres-payment:
    image: postgres:15
    ports:
      - "56425:5432"
    environment:
      POSTGRES_DB: hotel_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - payment_data:/var/lib/postgresql/data

  payment-service:
    build: ./HotelSystem_Backend/HotelSystem_PAYMENT
    ports:
      - "8085:8085"
    depends_on:
      - postgres-payment
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-payment:5432/hotel_payment
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      PAYMENT_CHECKIN_CONFIRM_URL: ${VITE_PUBLIC_APP_ORIGIN:-http://localhost:3000}/payment/confirm
      EUREKA_URL: http://eureka-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh


  # ========================
  # NOTIFICATION DB + SERVICE
  # ========================
  postgres-notification:
    image: postgres:15
    ports:
      - "56426:5432"
    environment:
      POSTGRES_DB: hotel_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - notification_data:/var/lib/postgresql/data

  notification-service:
    build: ./HotelSystem_Backend/HotelSystem_NOTIFICATION
    ports:
      - "8086:8086"
    depends_on:
      - postgres-notification
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-notification:5432/hotel_notification
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      EUREKA_URL: http://eureka-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh

  # ========================
  # API GATEWAY
  # ========================
  api-gateway:
    build: ./HotelSystem_Backend/HotelSystem_GATEWAY
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - redis
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Ho_Chi_Minh


  # ========================
  # FRONTEND
  # ========================
  frontend:
    build: ./HotelSystem
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - user-service
      - room-service
      - booking-service
      - payment-service
      - notification-service
      - api-gateway


volumes:
  pgadmin_data:
  auth_data:
  user_data:
  room_data:
  booking_data:
  payment_data:
  notification_data:
