services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: thaiquoc
      RABBITMQ_DEFAULT_PASS: 123456

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres-auth:
    image: postgres:15
    ports:
      - "54321:5432"
    environment:
      POSTGRES_DB: hotel_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - auth_data:/var/lib/postgresql/data

  postgres-user:
    image: postgres:15
    ports:
      - "54322:5432"
    environment:
      POSTGRES_DB: hotel_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - user_data:/var/lib/postgresql/data

  postgres-room:
    image: postgres:15
    ports:
      - "54323:5432"
    environment:
      POSTGRES_DB: hotel_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - room_data:/var/lib/postgresql/data

  postgres-booking:
    image: postgres:15
    ports:
      - "54324:5432"
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - booking_data:/var/lib/postgresql/data

  postgres-payment:
    image: postgres:15
    ports:
      - "54325:5432"
    environment:
      POSTGRES_DB: hotel_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - payment_data:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:15
    ports:
      - "54326:5432"
    environment:
      POSTGRES_DB: hotel_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - notification_data:/var/lib/postgresql/data

  auth-service:
    image: ${CI_REGISTRY_IMAGE}/auth-service:${IMAGE_TAG}
    ports:
      - "8081:8081"
    depends_on:
      - postgres-auth
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/hotel_auth
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456

  user-service:
    image: ${CI_REGISTRY_IMAGE}/user-service:${IMAGE_TAG}
    ports:
      - "8082:8082"
    depends_on:
      - postgres-user
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-user:5432/hotel_user
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456

  room-service:
    image: ${CI_REGISTRY_IMAGE}/room-service:${IMAGE_TAG}
    ports:
      - "8083:8083"
    depends_on:
      - postgres-room
      - rabbitmq
      - redis
    environment:
      DB_URL: jdbc:postgresql://postgres-room:5432/hotel_room
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis

  booking-service:
    image: ${CI_REGISTRY_IMAGE}/booking-service:${IMAGE_TAG}
    ports:
      - "8084:8084"
    depends_on:
      - postgres-booking
      - rabbitmq
      - room-service
    environment:
      DB_URL: jdbc:postgresql://postgres-booking:5432/hotel_booking
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      ROOM_SERVICE_URL: http://room-service:8083

  payment-service:
    image: ${CI_REGISTRY_IMAGE}/payment-service:${IMAGE_TAG}
    ports:
      - "8085:8085"
    depends_on:
      - postgres-payment
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-payment:5432/hotel_payment
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456

  notification-service:
    image: ${CI_REGISTRY_IMAGE}/notification-service:${IMAGE_TAG}
    ports:
      - "8086:8086"
    depends_on:
      - postgres-notification
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-notification:5432/hotel_notification
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${IMAGE_TAG}
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - user-service
      - room-service
      - booking-service
      - payment-service
      - notification-service

volumes:
  auth_data:
  user_data:
  room_data:
  booking_data:
  payment_data:
  notification_data:
