services:
  # ========================
  # RABBITMQ
  # ========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: thaiquoc
      RABBITMQ_DEFAULT_PASS: 123456

  # ========================
  # PGADMIN (UI quan ly DB)
  # ========================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    depends_on:
      - postgres-auth
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ========================
  # AUTH DB + SERVICE (DEV HOT RELOAD)
  # ========================
  postgres-auth:
    image: postgres:15
    ports:
      - "55421:5432"
    environment:
      POSTGRES_DB: hotel_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - auth_data:/var/lib/postgresql/data

  auth-service:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn -DskipTests spring-boot:run
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./HotelSystem_Backend/HotelSystem_AUTH:/app
      - maven-repo:/root/.m2
    ports:
      - "8081:8081"
    depends_on:
      - postgres-auth
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/hotel_auth
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456

  user-service:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn -DskipTests spring-boot:run
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./HotelSystem_Backend/HotelSystem_USER:/app
      - maven-repo:/root/.m2
    ports:
      - "8082:8082"
    depends_on:
      - postgres-auth
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/hotel_auth
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      SPRING_JPA_HIBERNATE_DDL_AUTO: update


  # ========================
  # ROOM DB + SERVICE (DEV HOT RELOAD)
  # ========================
  postgres-room:
    image: postgres:15
    ports:
      - "55423:5432"
    environment:
      POSTGRES_DB: hotel_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - room_data:/var/lib/postgresql/data

  room-service:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn -DskipTests spring-boot:run
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./HotelSystem_Backend/HotelSystem_ROOM:/app
      - maven-repo:/root/.m2
    ports:
      - "8083:8083"
    depends_on:
      - postgres-room
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-room:5432/hotel_room
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      SEED_ENABLED: "true"
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-secret-key}
      AWS_REGION: ap-southeast-2
      AWS_S3_BUCKET: ktpmbtl-s3-bucket

  # ========================
  # BOOKING DB + SERVICE (DEV HOT RELOAD)
  # ========================
  postgres-booking:
    image: postgres:15
    ports:
      - "55424:5432"
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - booking_data:/var/lib/postgresql/data

  booking-service:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn -DskipTests spring-boot:run
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./HotelSystem_Backend/HotelSystem_BOOKING:/app
      - maven-repo:/root/.m2
    ports:
      - "8084:8084"
    depends_on:
      - postgres-booking
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-booking:5432/hotel_booking
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456

  # ========================
  # PAYMENT DB + SERVICE (DEV HOT RELOAD)
  # ========================
  postgres-payment:
    image: postgres:15
    ports:
      - "55425:5432"
    environment:
      POSTGRES_DB: hotel_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - payment_data:/var/lib/postgresql/data

  payment-service:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn -DskipTests spring-boot:run
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./HotelSystem_Backend/HotelSystem_PAYMENT:/app
      - maven-repo:/root/.m2
    ports:
      - "8085:8085"
    depends_on:
      - postgres-payment
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-payment:5432/hotel_payment
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456
      # ── VNPAY Sandbox credentials (từ vnpay_nodejs/config/default.json) ──
      VNP_TMN_CODE: ${VNP_TMN_CODE:-E6BOARWZ}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-O6OOMFFZPBLYQM9EGHLRTZEJUMPGCQZJ}
      VNP_PAY_URL: ${VNP_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-http://localhost:8085/payments/vnpay-return}
      VNP_FRONTEND_RETURN_URL: ${VNP_FRONTEND_RETURN_URL:-http://localhost:3000/payment-result}

  # ========================
  # NOTIFICATION DB + SERVICE (DEV HOT RELOAD)
  # ========================
  postgres-notification:
    image: postgres:15
    ports:
      - "55426:5432"
    environment:
      POSTGRES_DB: hotel_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quocthai
    volumes:
      - notification_data:/var/lib/postgresql/data

  notification-service:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn -DskipTests spring-boot:run
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./HotelSystem_Backend/HotelSystem_NOTIFICATION:/app
      - maven-repo:/root/.m2
    ports:
      - "8086:8086"
    depends_on:
      - postgres-notification
      - rabbitmq
    environment:
      DB_URL: jdbc:postgresql://postgres-notification:5432/hotel_notification
      DB_USERNAME: postgres
      DB_PASSWORD: quocthai
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: thaiquoc
      RABBIT_PASSWORD: 123456

  # ========================
  # FRONTEND (VITE HOT RELOAD)
  # ========================
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./HotelSystem:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - user-service
      - room-service
      - booking-service
      - payment-service
      - notification-service
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DOCKER: "true"

volumes:
  pgadmin_data:
  auth_data:
  room_data:
  booking_data:
  payment_data:
  notification_data:
  maven-repo:
  frontend-node-modules:
